<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi app</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
     
    <header>
        <h1>Mi app</h1>
    </header>

    <div class="container">
        <aside>
            <h2>Categorías</h2>
            <ul>
                <li>Trabajo</li>
                <li>Estudio</li>
                <li>Personal</li>
            </ul>

        </aside>

        <main>
            <section class="crear-deberes">

                <!-- Agregamos un input para escribir tareas --> 
                <input type="text" id="taskInput" placeholder="Escribe tu tarea aquí...">

                <!-- Agregamos un input para buscar tareas -->
                <input type="text" id="searchInput" placeholder="Buscar tarea..."> 

                <div id="prioridad-btn">
                    <button class="prioridad-btn" data-prioridad="alta">alta</button>
                    <button class="prioridad-btn" data-prioridad="media">media</button>
                    <button class="prioridad-btn" data-prioridad="baja">baja</button>

                </div>
                <button id="addTaskBtn">Añadir</button>
            </section>
            
            <section class="lista-de-deberes" id="taskList">

            </section>

            
        </main>
    </div>

    <script src="app.js"></script>

</body>
</html>
