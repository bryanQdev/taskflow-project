<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi app</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Mi app</h1>
    </header>

    <div class="container">
      <aside>
        <h2>Estadísticas</h2>
        <ul id="estadisticas">
          <li>Total: <span id="stat-total">0</span></li>
          <li>Pendientes: <span id="stat-pendientes">0</span></li>
          <li>Completadas: <span id="stat-completadas">0</span></li>
        </ul>
      </aside>

      <main>
        <section class="crear-deberes">
          <!-- Agregamos un input para escribir tareas -->
          <label for="taskInput">Nueva tarea</label>
          <input
            type="text"
            id="taskInput"
            placeholder="Escribe tu tarea aquí..."
            
          />
          <p id="mensaje-error-longitud" style="display:none; color:red; font-size:0.8em;">
            La tarea debe tener al menos 3 caracteres.
          </p>
          

          <!-- Agregamos un input para buscar tareas -->
          <label for="searchInput">Buscar tarea</label>
          <input type="text" id="searchInput" placeholder="Buscar tarea..." />
          

          <div id="prioridad-btn">
            <button class="prioridad-btn" data-prioridad="alta">alta</button>
            <button class="prioridad-btn" data-prioridad="media">media</button>
            <button class="prioridad-btn" data-prioridad="baja">baja</button>
          </div>
          <button id="addTaskBtn">Añadir</button>
        </section>

        <div id="acciones-globales">
          <button id="completeAllBtn">✓ Completar todas</button>
          <button id="deleteCompletedBtn">🗑 Borrar completadas</button>
        </div>
                
<div id="filtro-estado">
  <button class="filtro-btn activo" data-filtro="todas">Todas</button>
  <button class="filtro-btn" data-filtro="pendientes">Pendientes</button>
  <button class="filtro-btn" data-filtro="completadas">Completadas</button>
</div>


        <section class="lista-de-deberes" id="taskList"></section>
      </main>
    </div>

    <!-- PIE DE PAGINA-->
    <footer>
      <p>MI app de tareas-2026</p>
    </footer>
    <template id="tarea-template">
      <div class="deberes">
        <h2 class="tarea-texto"></h2>
        <span class="categoria">General</span>
        <span class="prioridad"></span>
        <button class="completeBtn">✓ Completar</button>
        <button class="deleteBtn">Eliminar</button>
        <button class="editBtn">✏️ Editar</button>
      </div>
    </template>
    <script src="app.js"></script>
  </body>
</html>
